spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.liquibase.change-log=classpath:liquibase/changelog.xml
spring.liquibase.enabled=true
spring.main.allow-bean-definition-overriding=true

weather.base.api.url=https://api.openweathermap.org
weather.api.url.suffix=/data/2.5/weather
forecast.api.url.suffix=/data/2.5/forecast
geo.api.url.suffix=/geo/1.0/direct
weather.api.key=${WEATHER_API_KEY}
weather.tile.base.url=https://tile.openweathermap.org/map

spring.cache.type=redis

# --- Mail ---
spring.mail.host=localhost
spring.mail.port=1025

# --- Remember-me ---
security.remember-me.key=test-remember-me-key-not-for-production
security.remember-me.token-validity-seconds=1209600
<form class="row w-100" method="get" th:action="@{/search}">
    <div class="input-group">
        <input th:attr="aria-label=#{search.aria-label}" aria-label="Search for a location" class="form-control" id="search" name="q"
               th:placeholder="#{search.placeholder}" placeholder="Enter the location name"
               required type="text">
        <button class="btn btn-primary" type="submit" th:text="#{search.submit}">Search</button>
    </div>
</form>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/common :: commonHead('Weather Viewer - Map')}"></head>

<th:block th:fragment="headContent">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        #weather-map {
            width: 100%;
            height: 70vh;
            min-height: 400px;
            border-radius: 0.75rem;
            border: 1px solid var(--bs-border-color);
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .weather-map-marker-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            background-color: var(--bs-primary);
            color: #fff;
            font-size: 0.95rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .weather-map-marker-pin i {
            transform: rotate(45deg);
        }

        .weather-map-popup-title {
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .weather-map-popup-link {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.875rem;
            text-decoration: none;
        }

        .weather-map-popup-link:hover {
            text-decoration: underline;
        }
    </style>
</th:block>

<th:block th:fragment="bodyContent">
    <div th:replace="~{header-component}"></div>
    <div class="container min-vh-100">
        <h2 class="mb-3" th:text="#{map.title}">Map</h2>
        <p class="text-muted mb-4" th:text="#{map.instructions}">Your saved locations, plus an optional weather overlay. Use the layers control (top right) to switch overlays.</p>

        <div id="weather-map"></div>

        <p class="text-muted small mt-3" th:if="${#lists.isEmpty(locations)}" th:text="#{home.no-location.instructions}">
            Please add a location to view weather. You can do it by using the search bar above.
        </p>
    </div>
    <div th:replace="~{footer-component}"></div>
</th:block>

<th:block th:fragment="extraScripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script th:src="@{/js/theme-toggle.js}"></script>

    <script type="application/json" id="map-data" th:utext="${mapDataJson}"></script>
    <script th:src="@{/js/map-init.js}"></script>
</th:block>

</html>

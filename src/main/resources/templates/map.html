<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/common :: commonHead('Weather Viewer - Map')}"></head>

<th:block th:fragment="headContent">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" th:href="@{/css/alerts.css}">
    <style>
        #weather-map {
            width: 100%;
            height: 70vh;
            min-height: 400px;
            border-radius: 0.75rem;
            border: 1px solid var(--bs-border-color);
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .weather-map-marker-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            background-color: var(--bs-primary);
            color: #fff;
            font-size: 0.95rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .weather-map-marker-pin i {
            transform: rotate(45deg);
        }

        .weather-map-popup-title {
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .weather-map-popup-link {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.875rem;
            text-decoration: none;
        }

        .weather-map-popup-link:hover {
            text-decoration: underline;
        }
    </style>
</th:block>

<th:block th:fragment="bodyContent">
    <div th:replace="~{header-component}"></div>
    <div class="container min-vh-100">
        <h2 class="mb-3" th:text="#{map.title}">Map</h2>
        <p class="text-muted mb-1" th:text="#{map.instructions}">Your saved locations, plus an optional weather overlay. Use the layers control (top right) to switch overlays.</p>
        <p class="text-muted mb-4" th:text="#{map.add-location.hint}">Click anywhere on the map to save that spot as a location.</p>

        <div id="weather-map"></div>

        <p class="text-muted small mt-3" th:if="${#lists.isEmpty(locations)}" th:text="#{home.no-location.instructions}">
            Please add a location to view weather. You can do it by using the search bar above.
        </p>
    </div>

    <!--
        Server-rendered (rather than built as a Leaflet popup) so Thymeleaf
        processes th:action normally and its Spring Security integration
        auto-injects the CSRF hidden field, same as search.html's
        add-location form. map-init.js only fills in the lat/lon/name
        fields and shows it as a Bootstrap modal when the map is clicked.
    -->
    <div class="modal fade" id="add-location-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form id="map-add-location-form" th:action="@{/search/add}" method="post" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="#{map.add-location.title}">Add this location</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{alerts.close}" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="redirectTo" value="/map">
                    <input type="hidden" name="latitude" id="map-add-location-lat-input">
                    <input type="hidden" name="longitude" id="map-add-location-lon-input">
                    <div class="mb-3">
                        <label for="map-add-location-name-input" class="form-label" th:text="#{map.add-location.name-label}">Name</label>
                        <input type="text" class="form-control" id="map-add-location-name-input" name="name" maxlength="100" required>
                    </div>
                    <p class="text-muted small mb-0">
                        <span th:text="#{map.add-location.coordinates-label}">Coordinates:</span>
                        <span id="add-location-coords"></span>
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{map.add-location.cancel}">Cancel</button>
                    <button type="submit" class="btn btn-primary" th:text="#{map.add-location.submit}">Add location</button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{footer-component}"></div>
</th:block>

<th:block th:fragment="extraScripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script th:src="@{/js/theme-toggle.js}"></script>

    <script id="map-data" type="application/json" th:utext="${mapDataJson}"></script>
    <script th:src="@{/js/map-init.js}"></script>
</th:block>

</html>

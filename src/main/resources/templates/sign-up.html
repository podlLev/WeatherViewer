<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/common :: commonHead('Weather Viewer - Sign Up')}"></head>

<th:block th:fragment="headContent">
    <link rel="stylesheet" th:href="@{/css/authentication.css}">
</th:block>

<th:block th:fragment="bodyContent">
    <div class="container-fluid p-0">
        <div class="d-flex justify-content-center align-items-center vh-100">
            <div class="bg-image"></div>
            <div class="form mx-auto row p-4">
                <h3 class="my-4 text-center" th:text="#{signup.title}">Sign up</h3>

                <form method="post" th:action="@{/sign-up}" th:object="${user}">
                    <input type="hidden" name="redirect" th:value="${redirect}" />
                    <div class="form-floating mb-4">
                        <input type="text" class="form-control" th:field="*{firstName}" id="first-name" name="first-name"
                               th:placeholder="#{signup.first-name.placeholder}" placeholder="John" required>
                        <label for="first-name" th:text="#{signup.first-name.label}">First name</label>
                        <div th:if="${#fields.hasErrors('firstName')}" class="text-danger small mt-1" th:errors="*{firstName}"></div>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="text" class="form-control" th:field="*{lastName}" id="last-name" name="last-name"
                               th:placeholder="#{signup.last-name.placeholder}" placeholder="Doe" required>
                        <label for="last-name" th:text="#{signup.last-name.label}">Last name</label>
                        <div th:if="${#fields.hasErrors('lastName')}" class="text-danger small mt-1" th:errors="*{lastName}"></div>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="text" class="form-control" th:field="*{email}" id="email" name="email"
                               th:placeholder="#{signin.email.placeholder}" placeholder="name@example.com" required>
                        <label for="email" th:text="#{signin.email.label}">Email</label>
                        <div th:if="${#fields.hasErrors('email')}" class="text-danger small mt-1" th:errors="*{email}"></div>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" th:field="*{password}" id="password" name="password"
                               th:placeholder="#{signin.password.placeholder}" placeholder="Password" required>
                        <label for="password" th:text="#{signin.password.label}">Password</label>
                        <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-1" th:errors="*{password}"></div>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control"  th:field="*{repeatPassword}" id="repeat-password" name="repeat-password"
                               th:placeholder="#{signup.repeat-password.placeholder}" placeholder="Repeat password" required>
                        <label for="repeat-password" th:text="#{signup.repeat-password.label}">Repeat password</label>
                        <div th:if="${#fields.hasErrors('repeatPassword')}" class="text-danger small mt-1" th:errors="*{repeatPassword}"></div>
                    </div>
                    <div>
                        <button class="btn btn-lg btn-primary mb-4 w-100" type="submit" th:text="#{signup.submit}">Sign up</button>
                        <div class="text-center">
                            <p>
                                <span th:text="#{signup.have-account}">Already have an account -</span>
                                <a href="sign-in" th:href="@{/sign-in}" th:text="#{signup.sign-in-link}">Sign in</a>
                            </p>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="extraScripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
    <script th:src="@{/js/theme-toggle.js}"></script>
</th:block>

</html>

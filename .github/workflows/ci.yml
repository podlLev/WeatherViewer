name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------
  # 1. Build + test on every push and every PR
  # ---------------------------------------------------------------------
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run tests
        env:
          WEATHER_API_KEY: dummy-ci-key
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Maven Tests
          path: "target/surefire-reports/*.xml,target/failsafe-reports/*.xml"
          reporter: java-junit

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Build jar
        env:
          WEATHER_API_KEY: dummy-ci-key
        run: ./mvnw -B package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar

  # ---------------------------------------------------------------------
  # 2. Regenerate the coverage badge from the JaCoCo report and commit it
  #    - runs ONLY on: pushes to main or dev
  #    - the ref check alone excludes pull_request events: their ref is
  #      refs/pull/<number>/merge, never refs/heads/main or .../dev
  #    - actions/checkout defaults to the triggering ref, so the commit
  #      lands back on whichever branch (main or dev) was just pushed
  #    - reads target/site/jacoco/jacoco.csv from the `test` job above
  # ---------------------------------------------------------------------
  coverage-badge:
    name: Update Coverage Badge
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download JaCoCo report
        uses: actions/download-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: false
          generate-summary: false

      - name: Commit badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge [skip ci]"
          file_pattern: .github/badges/*.svg

  # ---------------------------------------------------------------------
  # 3. Build + push a versioned image to Docker Hub
  #    - runs ONLY on: pushes to main
  #    - every push to main -> :<pom-version>  :latest
  #    - pushes to dev, and all PRs -> this job does not run at all
  #      (dev/PRs are still covered by the `test` job above)
  # ---------------------------------------------------------------------
  docker:
    name: Build & Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version from pom.xml
        id: pom
        run: |
          chmod +x ./mvnw
          VERSION=$(./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/weather-viewer
          tags: |
            type=raw,value=${{ steps.pom.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max